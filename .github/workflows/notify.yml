name: notify

# This workflow is started from outside GitHub: cron-job.org calls the
# workflow-dispatch API at each configured send time (see README, "How it works").
# There is deliberately no `schedule:` trigger. GitHub's own scheduler never
# dispatched a single run for this repository, and if it woke up later it would
# post a second time inside the same slot.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the configured send times"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Send prices
        run: node dist/main.js ${{ inputs.force == true && '--force' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
